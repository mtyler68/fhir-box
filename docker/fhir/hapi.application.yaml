spring:
  autoconfigure:
    exclude: []
  elasticsearch:
    uris: http://hapi-elasticsearch:9200
  datasource:
    url: jdbc:postgresql://hapi-fhir-postgres:5432/hapi
    username: admin
    password: admin
    driverClassName: org.postgresql.Driver
  jpa:
    properties:
      hibernate.dialect: ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgresDialect
      hibernate.search.enabled: true
      hibernate.search.schema_management.strategy: CREATE
      hibernate.search.backend.type: elasticsearch
      hibernate.search.backend.protocol: http
      hibernate.search.backend.hosts: hapi-elasticsearch:9200
      hibernate.search.backend.analysis.configurer: ca.uhn.fhir.jpa.search.HapiHSearchAnalysisConfigurers$HapiElasticsearchAnalysisConfigurer
      hibernate.search.backend.schema_management.settings_file: ca/uhn/fhir/jpa/elastic/index-settings.json
      hibernate.search.backend.schema_management.minimal_required_status: yellow
      hibernate.search.backend.schema_management.minimal_required_status_wait_timeout: 10000

elasticsearch:
  enabled: true
  rest_url: hapi-elasticsearch:9200
  protocol: http
  required_index_status: YELLOW
  schema_management_strategy: CREATE

management:
  health:
    elasticsearch:
      enabled: false

hapi:
  fhir:
    # Recreate the Postgres volume after changing fhir_version or ID strategy.
    fhir_version: R5
    server_id_strategy: UUID
    client_id_strategy: ANY
    allow_cascading_deletes: true
    allow_multiple_delete: true
    expunge_enabled: true
    delete_expunge_enabled: true
    openapi_enabled: true
    search_index_full_text_enabled: true
    subscription:
      resthook_enabled: true
    cors:
      allow_Credentials: true
      allowed_origin:
        - http://localhost:8080
        - http://localhost:8480
