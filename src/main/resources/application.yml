spring:
  application:
    name: fhir-box
  profiles:
    default: local
  jackson:
    default-property-inclusion: non_null
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: hapi-fhir
              uri: ${cadmin.fhir.uri}
              predicates:
                - Path=/fhir/**
              filters:
                - RemoveRequestHeader=Cookie
            - id: wiremock
              uri: ${cadmin.wiremock.uri}
              predicates:
                - Path=/wiremock/**
              filters:
                - StripPrefix=1
                - RemoveRequestHeader=Cookie
            - id: core-admin-bridge
              uri: ${cadmin.core-admin-bridge.uri}
              predicates:
                - Path=/core-admin-bridge/**
              filters:
                - StripPrefix=1
                - RemoveRequestHeader=Cookie
            - id: fhir-chief
              uri: ${cadmin.fhir-chief.uri}
              predicates:
                - Path=/fhir-chief/**
              filters:
                - StripPrefix=1
                - RemoveRequestHeader=Cookie
            - id: icg
              uri: ${cadmin.icg.uri}
              predicates:
                - Path=/icg/**
              filters:
                - StripPrefix=1
                - RemoveRequestHeader=Cookie

server:
  port: ${CADMIN_PORT:8080}

cadmin:
  security:
    mode: local
    users:
      - username: admin
        password: admin
        roles:
          - ADMIN
          - USER
      - username: clinician
        password: clinician
        roles:
          - USER
  fhir:
    uri: ${CADMIN_FHIR_URI:http://localhost:8081}
  geocode:
    uri: ${CADMIN_GEOCODE_URI:https://nominatim.openstreetmap.org}
    user-agent: FHIR-Box/0.1 (io.cadmin.gateway; location-geocoder)
  npi-registry:
    uri: ${CADMIN_NPI_URI:https://npiregistry.cms.hhs.gov/api/}
    version: "2.1"
  wiremock:
    uri: ${CADMIN_WIREMOCK_URI:http://localhost:9090}
  core-admin-bridge:
    uri: ${CADMIN_CORE_ADMIN_BRIDGE_URI:http://localhost:8280}
  fhir-chief:
    uri: ${CADMIN_FHIR_CHIEF_URI:http://localhost:8380}
  icg:
    uri: ${CADMIN_ICG_URI:http://localhost:8480}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: Hands-on explorer for FHIR resources, search, and server capabilities

logging:
  level:
    io.cadmin: INFO
    org.springframework.cloud.gateway: INFO
    org.springframework.security: INFO
    org.springframework.web: INFO
    org.springframework.web.server: INFO
    org.springframework.http.server.reactive: INFO
    reactor.netty.http.server: INFO
