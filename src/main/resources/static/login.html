<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FHIR Box · Sign in</title>
    <script>
        (() => {
            "use strict";
            const root = document.documentElement;
            if (root.getAttribute("data-lte-color-mode") === "off") {
                return;
            }
            let stored = null;
            try {
                stored = localStorage.getItem("lte-theme");
                if (!stored) {
                    localStorage.setItem("lte-theme", "auto");
                    stored = "auto";
                }
            } catch {
                // localStorage may be unavailable
            }
            const authored = root.getAttribute("data-bs-theme");
            let resolved = "light";
            if (stored === "dark" || stored === "light") {
                resolved = stored;
            } else if (authored === "dark" || authored === "light") {
                resolved = authored;
            } else if (globalThis.matchMedia("(prefers-color-scheme: dark)").matches) {
                resolved = "dark";
            }
            root.setAttribute("data-bs-theme", resolved);
            root.style.colorScheme = resolved;
            if (resolved !== authored) {
                root.setAttribute("data-lte-theme-resolved", "");
            }
        })();
    </script>
    <link href="https://cdn.jsdelivr.net/npm/admin-lte@4.3.1/dist/css/adminlte.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/css/cadmin.css" rel="stylesheet">
</head>
<body class="login-page bg-body-secondary">
<div class="login-box">
    <div class="login-logo">
        <a href="/"><i class="bi bi-box-seam me-1"></i><b>FHIR</b> Box</a>
    </div>
    <div class="card">
        <div class="card-body login-card-body">
            <p class="login-box-msg">Explore what FHIR can do</p>
            <div id="login-alert" class="alert d-none" role="alert"></div>
            <form id="local-login-form" class="d-none">
                <div class="input-group mb-3">
                    <input type="text" class="form-control" id="username" name="username"
                           placeholder="Username" autocomplete="username" required>
                    <div class="input-group-text"><i class="bi bi-person"></i></div>
                </div>
                <div class="input-group mb-3">
                    <input type="password" class="form-control" id="password" name="password"
                           placeholder="Password" autocomplete="current-password" required>
                    <div class="input-group-text"><i class="bi bi-lock"></i></div>
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-primary" id="login-submit">Sign in</button>
                </div>
                <p class="text-center text-muted small mt-3 mb-0">
                    Default users: admin / admin, clinician / clinician
                </p>
            </form>
            <div id="oidc-login" class="d-none text-center">
                <p class="text-muted">Sign in with your organization identity provider. You can choose a different user on the next screen.</p>
                <a class="btn btn-primary w-100" id="oidc-login-link" href="/oauth2/authorization/keycloak">
                    <i class="bi bi-shield-lock me-2"></i>Continue with Keycloak
                </a>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="/js/api.js"></script>
<script>
    $(function () {
        const params = new URLSearchParams(window.location.search);
        if (params.has("error")) {
            CadminApi.showAlert("#login-alert", "danger", "Sign in failed. Check your credentials and try again.");
        } else if (params.has("logout")) {
            CadminApi.showAlert("#login-alert", "success", "You have been signed out.");
        }

        CadminApi.get("/api/auth/config").done(function (config) {
            if (config.mode === "oidc") {
                $("#oidc-login").removeClass("d-none");
                if (config.oidcLoginUrl) {
                    $("#oidc-login-link").attr("href", config.oidcLoginUrl);
                }
            } else {
                $("#local-login-form").removeClass("d-none");
            }
        }).fail(function () {
            $("#local-login-form").removeClass("d-none");
        });

        $("#local-login-form").on("submit", function (event) {
            event.preventDefault();
            const $button = $("#login-submit").prop("disabled", true).text("Signing in…");
            CadminApi.login($("#username").val(), $("#password").val())
                .done(function () {
                    window.location.href = "/";
                })
                .fail(function (xhr) {
                    const message = xhr.status === 403
                        ? "Sign in was blocked (CSRF). Refresh the page and try again."
                        : "Sign in failed. Check your credentials and try again.";
                    CadminApi.showAlert("#login-alert", "danger", message);
                    $button.prop("disabled", false).text("Sign in");
                });
        });
    });
</script>
</body>
</html>
