# Starts Keycloak, HAPI FHIR, Elasticsearch, WireMock, and Redis backing stacks together.
# Run the gateway on the host: ./mvnw spring-boot:run
# OIDC mode: ./mvnw spring-boot:run -Dspring-boot.run.profiles=oidc

include:
  - path: docker/fhir/compose.yml
  - path: docker/elasticsearch/compose.yml
  - path: docker/keycloak/compose.yml
  - path: docker/wiremock/compose.yml
  - path: docker/redis/compose.yml
